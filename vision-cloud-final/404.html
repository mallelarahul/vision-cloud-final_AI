<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Vision Cloud</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Bricolage+Grotesque:wght@800&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Outfit',sans-serif;
            background:linear-gradient(180deg,#0d0a08 0%,#1a1410 100%);
            color:#faf8f3; min-height:100vh;
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            text-align:center; padding:2rem; position:relative; overflow:hidden;
        }
        body::before {
            content:''; position:fixed; inset:0;
            background-image:
                linear-gradient(0deg,transparent 24%,rgba(217,119,6,0.04) 25%,rgba(217,119,6,0.04) 26%,transparent 27%),
                linear-gradient(90deg,transparent 24%,rgba(217,119,6,0.04) 25%,rgba(217,119,6,0.04) 26%,transparent 27%);
            background-size:50px 50px; pointer-events:none;
        }
        .glow {
            position:absolute; width:500px; height:500px; border-radius:50%;
            background:radial-gradient(circle,rgba(217,119,6,0.12) 0%,transparent 70%);
            top:50%; left:50%; transform:translate(-50%,-50%);
            filter:blur(80px); pointer-events:none;
        }
        .container { position:relative; z-index:1; max-width:600px; }
        .error-code {
            font-family:'Bricolage Grotesque',sans-serif;
            font-size:8rem; font-weight:800; line-height:1;
            background:linear-gradient(135deg,#d97706,#f59e0b,#f43f5e);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
            margin-bottom:0.5rem;
            animation:float 3s ease-in-out infinite;
        }
        @keyframes float { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-15px);} }
        .cloud-icon { font-size:4rem; margin-bottom:1rem; }
        h1 { font-family:'Bricolage Grotesque',sans-serif; font-size:2rem; margin-bottom:1rem; }
        p { color:#d1cac4; font-size:1.05rem; line-height:1.8; margin-bottom:2.5rem; }
        .btn-home {
            display:inline-flex; align-items:center; gap:0.6rem;
            background:linear-gradient(135deg,#d97706,#f59e0b,#f43f5e);
            color:#fff; padding:1rem 2.5rem; border-radius:14px;
            text-decoration:none; font-weight:700; font-size:1rem;
            box-shadow:0 0 40px rgba(217,119,6,0.4);
            transition:all 0.3s ease;
        }
        .btn-home:hover { transform:translateY(-4px); box-shadow:0 0 60px rgba(217,119,6,0.6); }
        .logo {
            position:absolute; top:2rem; left:50%; transform:translateX(-50%);
            font-size:1.4rem; font-weight:900;
            background:linear-gradient(135deg,#d97706,#f59e0b,#f43f5e);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
            text-decoration:none; white-space:nowrap;
        }
        .links { display:flex; gap:1.5rem; justify-content:center; margin-top:2rem; flex-wrap:wrap; }
        .links a { color:#a8a19b; text-decoration:none; font-size:0.9rem; transition:color 0.3s; }
        .links a:hover { color:#d97706; }
    </style>
</head>
<body>
    <div class="glow"></div>
    <a href="/" class="logo">☁️ Vision Cloud</a>
    <div class="container">
        <div class="cloud-icon">🌫️</div>
        <div class="error-code">404</div>
        <h1>Page Lost in the Cloud</h1>
        <p>Oops! The page you're looking for has drifted away. It may have been moved, deleted, or never existed. Let's get you back on track.</p>
        <a href="/" class="btn-home">← Back to Home</a>
        <div class="links">
            <a href="/#services">Services</a>
            <a href="/#pricing">Pricing</a>
            <a href="/#about">About</a>
            <a href="/#contact-section">Contact</a>
        </div>
    </div>
</body>
</html>
